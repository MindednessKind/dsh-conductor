# Host services needed by a headless dsh-base profile. Yield to Web's own rows.
- insert:
    - id: conductor-connection
      name: '@deepseek-ai/dsh-client-connection'
      disabled: !!js "[...ctx.loader.entries()].some(e => e.options.id !== 'conductor-connection' && e.options.name === '@deepseek-ai/dsh-client-connection' && !e.disabled)"
    - id: conductor-workspace
      name: '@deepseek-ai/dsh-workspace'
      disabled: !!js "[...ctx.loader.entries()].some(e => e.options.id !== 'conductor-workspace' && e.options.name === '@deepseek-ai/dsh-workspace' && !e.disabled)"
    - id: conductor-session-controller
      name: '@deepseek-ai/dsh-api-session-controller'
      disabled: !!js "[...ctx.loader.entries()].some(e => e.options.id !== 'conductor-session-controller' && e.options.name === '@deepseek-ai/dsh-api-session-controller' && !e.disabled)"
    - id: conductor-file-uploads
      name: '@deepseek-ai/dsh-client-file-upload'
      disabled: !!js "[...ctx.loader.entries()].some(e => e.options.id !== 'conductor-file-uploads' && e.options.name === '@deepseek-ai/dsh-client-file-upload' && !e.disabled)"
    - id: conductor-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      disabled: !!js "[...ctx.loader.entries()].some(e => e.options.id !== 'conductor-preset-registry' && e.options.name === '@deepseek-ai/dsh-agent-preset-registry' && !e.disabled)"
      config:
        default: dsh-conductor-router

